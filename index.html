<!doctype html>
<html lang="es" class="h-full bg-slate-50 text-slate-900 antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOSOL INMOBILIARIA - ERP &amp; Gestión de Cobranzas</title>
    <meta name="description" content="Sistema empresarial ERP de cobranzas, cartera inmobiliaria, ventas y control de pagos para Ecosol Inmobiliaria" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ecosol_empresa_config');
          if (saved) {
            var cfg = JSON.parse(saved);
            if (cfg.nombreEmpresa) {
              document.title = cfg.nombreEmpresa + ' - ERP & Gestión de Cobranzas';
            }
            if (cfg.logoUrl) {
              var icon = document.querySelector("link[rel*='icon']");
              if (icon) {
                icon.href = cfg.logoUrl;
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 selection:bg-emerald-500 selection:text-white">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
